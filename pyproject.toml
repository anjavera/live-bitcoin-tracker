[project]
name = "btc15-widget"
version = "0.1.0"
description = "Unofficial live widget for Polymarket US BTC Up or Down 15-minute markets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "polymarket-us>=0.1.2",
    "python-dotenv>=1.2.3",
    "textual>=8.2.8",
    "platformdirs>=4.0",
    "tzdata>=2024.1",  # Windows has no system timezone database
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pm = "btc15_widget.cli:main"
btc15-widget = "btc15_widget.app:main"
btc15-gui = "btc15_widget.gui.main:cli"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
