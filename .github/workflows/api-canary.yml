name: API canary

# Once a week, ask Polymarket's live public API for each frame and check the fields the app reads are still there.
# A failed run means the API changed (or is down): GitHub emails the repository owner.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/api_canary.py
