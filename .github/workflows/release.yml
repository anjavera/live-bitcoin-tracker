name: Release

# Builds the standalone apps (no Python needed) and attaches them to a GitHub Release.
# Run by pushing a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bitcoin-tracker-tui-linux-x86_64
            exe: bitcoin-tracker-tui
          - os: macos-latest
            asset: bitcoin-tracker-tui-macos-arm64
            exe: bitcoin-tracker-tui
          - os: windows-latest
            asset: bitcoin-tracker-tui-windows-x86_64.exe
            exe: bitcoin-tracker-tui.exe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Build the standalone app
        run: >
          uv run --with pyinstaller pyinstaller --onefile --name bitcoin-tracker-tui
          --collect-all textual --collect-submodules live_bitcoin_tracker
          --copy-metadata polymarket-us --copy-metadata live-bitcoin-tracker
          --hidden-import _cffi_backend --collect-all nacl --collect-all cffi
          packaging/tracker_tui_app.py
      - name: Smoke test (no network)
        shell: bash
        run: ./dist/${{ matrix.exe }} --version
      - name: Name the file for the release page
        shell: bash
        run: mv "dist/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  build-gui:
    name: build GUI (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bitcoin-tracker-linux-x86_64
          - os: macos-latest
            asset: bitcoin-tracker-macos-arm64.zip
          - os: windows-latest
            asset: bitcoin-tracker-windows-x86_64.exe
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install system libraries Qt needs (the smoke test starts the app)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: uv sync --extra gui
      - name: Build the desktop app (Linux)
        if: runner.os == 'Linux'
        run: >
          uv run --with pyinstaller pyinstaller --onefile --windowed --name bitcoin-tracker
          --collect-submodules live_bitcoin_tracker --collect-data live_bitcoin_tracker --copy-metadata polymarket-us --copy-metadata live-bitcoin-tracker
          --hidden-import _cffi_backend --collect-all nacl --collect-all cffi
          packaging/tracker_gui_app.py
      - name: Build the desktop app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          uv run --with pyinstaller pyinstaller --onefile --windowed --name bitcoin-tracker --icon packaging/icon.ico --version-file packaging/windows_version_info.txt
          --collect-submodules live_bitcoin_tracker --collect-data live_bitcoin_tracker --copy-metadata polymarket-us --copy-metadata live-bitcoin-tracker
          --hidden-import _cffi_backend --collect-all nacl --collect-all cffi
          packaging/tracker_gui_app.py
      - name: Build the desktop app (macOS, an .app bundle)
        if: runner.os == 'macOS'
        run: >
          uv run --with pyinstaller pyinstaller --windowed --name bitcoin-tracker --icon packaging/icon.icns
          --osx-bundle-identifier io.github.anjavera.livebitcointracker
          --collect-submodules live_bitcoin_tracker --collect-data live_bitcoin_tracker --copy-metadata polymarket-us --copy-metadata live-bitcoin-tracker
          --hidden-import _cffi_backend --collect-all nacl --collect-all cffi
          packaging/tracker_gui_app.py
      - name: Smoke test (no network, prints the version then draws one frame off-screen)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) BIN=dist/bitcoin-tracker.exe ;;
            macOS)   BIN=dist/bitcoin-tracker.app/Contents/MacOS/bitcoin-tracker ;;
            *)       BIN=dist/bitcoin-tracker ;;
          esac
          "$BIN" --version
          "$BIN" --snapshot smoke.png --keyless
          test -s smoke.png
      - name: Name the file for the release page
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) mv dist/bitcoin-tracker.exe "dist/${{ matrix.asset }}" ;;
            macOS)   ditto -c -k --keepParent dist/bitcoin-tracker.app "dist/${{ matrix.asset }}" ;;
            *)       mv dist/bitcoin-tracker "dist/${{ matrix.asset }}" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: [build, build-gui]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Add the Linux installer
        run: cp packaging/linux/install.sh packaging/linux/install-gui.sh packaging/linux/icon.png packaging/linux/live-bitcoin-tracker.desktop assets/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --title "Live Bitcoin Tracker $GITHUB_REF_NAME"
          --notes-file packaging/release_notes.md
